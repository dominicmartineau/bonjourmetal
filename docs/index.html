<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bonjour Metal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Poppins:wght@100;300;400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Grain canvas (dust effect) -->

  <!-- Header -->
  <header class="site-header">
    <div class="header-top">
      <span class="brand">Bonjour Metal</span>
      <span class="slogan">Heavy. Every day. Discover your next obsession.</span>
      <span class="header-date" id="nav-date"></span>
    </div>
  </header>

  <hr class="divider" />

  <!-- Daily content -->
  <main class="main">
    <div class="spotify-band">
      <a class="spotify-band-link" href="https://open.spotify.com/playlist/6D0kUjNKb4M5QNrbpCPt21?si=27d7825dfb214efe" target="_blank" rel="noopener">
        <svg class="spotify-icon" viewBox="0 0 24 24" aria-hidden="true" fill="currentColor">
          <path d="M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0zm5.516 17.308a.75.75 0 0 1-1.032.25c-2.822-1.724-6.374-2.114-10.56-1.158a.75.75 0 0 1-.333-1.463c4.579-1.045 8.507-.595 11.675 1.339a.75.75 0 0 1 .25 1.032zm1.472-3.276a.937.937 0 0 1-1.288.308c-3.228-1.983-8.148-2.558-11.97-1.399a.937.937 0 0 1-.578-1.786c4.36-1.41 9.78-.727 13.528 1.59a.937.937 0 0 1 .308 1.287zm.127-3.409c-3.868-2.297-10.248-2.509-13.942-1.388a1.125 1.125 0 0 1-.651-2.151c4.246-1.287 11.3-1.038 15.756 1.606a1.125 1.125 0 1 1-1.163 1.933z"/>
        </svg>
        Discover more metal — subscribe to the <strong>Bonjour Metal</strong> playlist on Spotify
      </a>
    </div>

    <div class="hero-content" id="hero-content">

      <!-- Ticker / Marquee -->
      <div class="ticker-outer">
        <div class="ticker-track" id="ticker-track"></div>
      </div>

      <div class="hero-cta">
        <button class="btn-play" id="play-btn">▶ Play video</button>
        <a class="btn-spotify hidden" id="spotify-link" href="#" target="_blank" rel="noopener">▶ Play on Spotify</a>
      </div>

      <div class="cta-rules">
        <hr class="cta-rule" />
        <div class="cta-signal" aria-hidden="true"></div>
        <hr class="cta-rule" />
      </div>

      <div class="player-wrap" id="player-wrap">
        <div id="yt-player"></div>
      </div>
    </div>

    <div class="not-found hidden" id="not-found">
      <p>No video today. Come back tomorrow.</p>
    </div>
  </main>

  <hr class="divider" />

  <!-- Footer (always visible) -->
  <footer class="footer">
    <div class="footer-inner">
      <span class="footer-copy">🤘 One riff a day keeps the silence away</span>
      <a href="https://omnomnom.threadless.com" target="_blank" rel="noopener" class="footer-ad">
        OmNomNom — Movies, music &amp; life on a t-shirt <span class="footer-cta">Shop now →</span>
      </a>
    </div>
  </footer>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script src="app.js"></script>
</body>
</html>
